# Conda equivalent of requirements.txt. Kept deliberately in sync — if you add a
# dependency to one, add it to the other.
#
# Deployment extras (boto3, sagemaker) are intentionally excluded; install them
# with `pip install -r requirements-deploy.txt` only when deploying.
name: nudge
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=2.0
  - pandas>=2.2
  - scipy>=1.13
  - scikit-learn>=1.5
  - xgboost>=2.1
  - duckdb>=1.0
  - pyarrow>=16
  - matplotlib>=3.9
  - plotly>=5.22
  - streamlit>=1.36
  - jupyterlab>=4.2
  - nbconvert>=7.16
  - nbformat>=5.10
  - black>=24
  - ruff>=0.5
  - pytest>=8
  - pip:
      - econml>=0.16
      - scikit-uplift>=0.5
